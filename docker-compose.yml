# Docker Compose Orchestration untuk Bursa Limbah (Node.js API + MySQL 8.4 + Nginx)

services:
  # 1. Backend API Service
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bursalimbah-api
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=bursalimbah_user
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in ignored .env}
      - [REDACTED]
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in ignored .env}
      - DEMO_MODE=false
    volumes:
      - ./server/uploads:/usr/src/app/uploads
      - ./server/backups:/usr/src/app/backups
      - ./server/logs:/usr/src/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal-net

  # 2. Database Service (MySQL 8.4 LTS)
  db:
    image: mysql:8.4
    container_name: bursalimbah-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: [REDACTED]
      MYSQL_DATABASE: bursalimbahdb
      MYSQL_USER: bursalimbah_user
      MYSQL_PASSWORD: [REDACTED]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/setup_complete.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-net

  # 3. Reverse Proxy & SSL Web Server (Nginx)
  web:
    image: nginx:alpine
    container_name: bursalimbah-web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge

volumes:
  mysql-data:
    driver: local
