# Nginx Reverse Proxy, Gzip Compression, SSL & Security Headers

upstream backend_cluster {
    server api:5000;
    keepalive 32;
}

# Rate limiting zone: maks 20 request per detik per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name localhost circulink.com www.circulink.com;

    # Gzip Compression Tuning
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend Statis
    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Blokir akses ke berkas rahasia
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }

    # Blokir akses internal ke folder server/ & backups/
    location ^~ /server/ {
        deny all;
        return 404;
    }

    location ^~ /backups/ {
        deny all;
        return 404;
    }

    # Caching untuk Eviden Produk Statis
    location /uploads/product-evidence/ {
        alias /var/www/html/server/uploads/product-evidence/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy ke Backend REST API
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout proxy
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
